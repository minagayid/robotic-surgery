name: RobotX CI

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile package and tests
        run: python -m compileall -q robotic_os tests
      - name: Run deterministic regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify simulation demo
        run: python -m robotic_os five-heart-demo --json
