<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RobotX full-case operating state machine</title><desc id="desc">Eight non-clinical operating stages with a safe-hold and conversion branch.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#132e42"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d7ff"/></marker><style>.b{fill:#13374e;stroke:#4e9ec3;stroke-width:3;rx:24}.g{fill:#17473f;stroke:#52dfbd;stroke-width:3;rx:24}.x{fill:#4a2e24;stroke:#ffab5b;stroke-width:3;rx:24}.t{font:700 27px 'Segoe UI',sans-serif;fill:#f6fbff}.s{font:500 18px 'Segoe UI',sans-serif;fill:#c2d4df}.line{fill:none;stroke:#62d7ff;stroke-width:5;marker-end:url(#a)}.warn{fill:none;stroke:#ffab5b;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text class="t" x="800" y="70" text-anchor="middle" font-size="43">Virtual Procedure — Robot Operating State</text>
  <g transform="translate(65 145)"><rect class="b" width="315" height="135"/><text class="t" x="158" y="50" text-anchor="middle">1 · Verify</text><text class="s" x="158" y="88" text-anchor="middle">Case · team · configuration</text><text class="s" x="158" y="116" text-anchor="middle">Training authorization</text></g>
  <g transform="translate(470 145)"><rect class="b" width="315" height="135"/><text class="t" x="158" y="50" text-anchor="middle">2 · Prepare</text><text class="s" x="158" y="88" text-anchor="middle">Readiness · fallback · checks</text><text class="s" x="158" y="116" text-anchor="middle">Drape and tools</text></g>
  <g transform="translate(875 145)"><rect class="b" width="315" height="135"/><text class="t" x="158" y="50" text-anchor="middle">3 · Dock</text><text class="s" x="158" y="88" text-anchor="middle">One arm at a time</text><text class="s" x="158" y="116" text-anchor="middle">Low-speed clearance</text></g>
  <g transform="translate(1280 145)"><rect class="g" width="255" height="135"/><text class="t" x="128" y="50" text-anchor="middle">4 · Authorize</text><text class="s" x="128" y="88" text-anchor="middle">Mode · segment</text><text class="s" x="128" y="116" text-anchor="middle">Control owner</text></g>
  <path class="line" d="M380 213H445"/><path class="line" d="M785 213H850"/><path class="line" d="M1190 213H1255"/>
  <g transform="translate(1155 395)"><rect class="g" width="380" height="135"/><text class="t" x="190" y="50" text-anchor="middle">5 · Surgeon-Controlled Run</text><text class="s" x="190" y="88" text-anchor="middle">Visualization · limits · S2</text><text class="s" x="190" y="116" text-anchor="middle">Explicit checkpoints</text></g>
  <path class="line" d="M1408 280V370"/>
  <g transform="translate(650 395)"><rect class="x" width="390" height="135"/><text class="t" x="195" y="50" text-anchor="middle">Exception · Safe Hold</text><text class="s" x="195" y="88" text-anchor="middle">Energy off · inspect state</text><text class="s" x="195" y="116" text-anchor="middle">Recover or end run</text></g>
  <path class="warn" d="M1155 463H1065"/><path class="line" d="M1040 422C1105 342 1190 335 1270 395"/>
  <g transform="translate(65 650)"><rect class="b" width="350" height="135"/><text class="t" x="175" y="50" text-anchor="middle">8 · Review</text><text class="s" x="175" y="88" text-anchor="middle">Seal logs · debrief</text><text class="s" x="175" y="116" text-anchor="middle">Quarantine faults</text></g>
  <g transform="translate(535 650)"><rect class="b" width="350" height="135"/><text class="t" x="175" y="50" text-anchor="middle">7 · Undock</text><text class="s" x="175" y="88" text-anchor="middle">Remove tools · counts</text><text class="s" x="175" y="116" text-anchor="middle">Park and clean</text></g>
  <g transform="translate(1005 650)"><rect class="b" width="350" height="135"/><text class="t" x="175" y="50" text-anchor="middle">6 · Complete</text><text class="s" x="175" y="88" text-anchor="middle">Final checkpoint</text><text class="s" x="175" y="116" text-anchor="middle">Motion + energy disabled</text></g>
  <path class="line" d="M1345 530C1345 590 1250 605 1180 625"/><path class="line" d="M1005 717H910"/><path class="line" d="M535 717H440"/>
  <path class="warn" d="M845 530V610"/><text class="s" x="865" y="585">End run / conversion drill</text>
  <text class="s" x="65" y="850">Synthetic-phantom training only · clinical technique intentionally omitted</text>
</svg>
