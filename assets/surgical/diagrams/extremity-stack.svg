<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RobotX extremity stack</title><desc id="desc">Eight modules from mobile base to end effector with safety evidence channels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f5"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2384ad"/></marker>
    <style>.m{fill:#fff;stroke:#5e788a;stroke-width:3;rx:20}.sterile{fill:#e4fbf6;stroke:#16a889;stroke-width:3;rx:20}.t{font:700 28px 'Segoe UI',sans-serif;fill:#153144}.s{font:500 19px 'Segoe UI',sans-serif;fill:#476171}.n{font:800 24px 'Segoe UI',sans-serif;fill:#fff}.c{fill:#2384ad}.line{stroke:#2384ad;stroke-width:5;marker-end:url(#a)}.e{stroke:#f19a37;stroke-width:4;stroke-dasharray:10 9;fill:none}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text class="t" x="800" y="75" text-anchor="middle" font-size="44">RobotX Arm + Extremity Functional Stack</text>
  <path class="line" d="M225 340H265"/><path class="line" d="M435 340H475"/><path class="line" d="M645 340H685"/><path class="line" d="M855 340H895"/><path class="line" d="M1065 340H1105"/><path class="line" d="M1275 340H1315"/>
  <g transform="translate(45 240)"><rect class="m" width="180" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">1</text><text class="t" x="90" y="85" text-anchor="middle">Locked</text><text class="t" x="90" y="120" text-anchor="middle">Base</text><text class="s" x="90" y="163" text-anchor="middle">Stability</text><text class="s" x="90" y="188" text-anchor="middle">power · brakes</text></g>
  <g transform="translate(265 240)"><rect class="m" width="170" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">2</text><text class="t" x="85" y="85" text-anchor="middle">7-DoF</text><text class="t" x="85" y="120" text-anchor="middle">Arm</text><text class="s" x="85" y="163" text-anchor="middle">Reach · pose</text><text class="s" x="85" y="188" text-anchor="middle">gravity hold</text></g>
  <g transform="translate(475 240)"><rect class="m" width="170" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">3</text><text class="t" x="85" y="85" text-anchor="middle">Access</text><text class="t" x="85" y="120" text-anchor="middle">RCM</text><text class="s" x="85" y="163" text-anchor="middle">Pivot · load</text><text class="s" x="85" y="188" text-anchor="middle">constraint</text></g>
  <g transform="translate(685 240)"><rect class="sterile" width="170" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">4</text><text class="t" x="85" y="85" text-anchor="middle">Sterile</text><text class="t" x="85" y="120" text-anchor="middle">Boundary</text><text class="s" x="85" y="163" text-anchor="middle">Drape · keyed</text><text class="s" x="85" y="188" text-anchor="middle">adapter</text></g>
  <g transform="translate(895 240)"><rect class="sterile" width="170" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">5</text><text class="t" x="85" y="85" text-anchor="middle">Instrument</text><text class="t" x="85" y="120" text-anchor="middle">Drive</text><text class="s" x="85" y="163" text-anchor="middle">Identity · life</text><text class="s" x="85" y="188" text-anchor="middle">position</text></g>
  <g transform="translate(1105 240)"><rect class="sterile" width="170" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">6</text><text class="t" x="85" y="85" text-anchor="middle">Shaft +</text><text class="t" x="85" y="120" text-anchor="middle">Wrist</text><text class="s" x="85" y="163" text-anchor="middle">Insertion · roll</text><text class="s" x="85" y="188" text-anchor="middle">pitch · yaw</text></g>
  <g transform="translate(1315 240)"><rect class="sterile" width="240" height="200"/><circle class="c" cx="35" cy="35" r="22"/><text class="n" x="35" y="43" text-anchor="middle">7</text><text class="t" x="120" y="85" text-anchor="middle">End</text><text class="t" x="120" y="120" text-anchor="middle">Effector</text><text class="s" x="120" y="163" text-anchor="middle">Tip force · release</text><text class="s" x="120" y="188" text-anchor="middle">retained parts</text></g>
  <path class="e" d="M135 500V620H1435V500"/>
  <rect x="295" y="610" width="1010" height="150" rx="26" fill="#fff4e6" stroke="#f19a37" stroke-width="3"/>
  <text class="t" x="800" y="663" text-anchor="middle">Independent evidence across the complete chain</text><text class="s" x="800" y="706" text-anchor="middle">Encoder agreement · latch · tip error · force · temperature · command age · safe release</text>
  <text class="s" x="65" y="835">Green modules cross or occupy the sterile boundary. Every tool has its own compatibility, life, and safe-state record.</text>
