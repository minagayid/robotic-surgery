[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotic-surgery"
version = "0.2.0"
description = "Research and simulation software for robotic surgery engineering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
ml = ["torch>=2.1", "opencv-python>=4.8", "mediapipe>=0.10", "transformers>=4.40"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
robotic-surgery = "robotic_surgery.cli:main"

[tool.setuptools.packages.find]
include = ["robotic_surgery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
