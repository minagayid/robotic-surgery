seed: 0
workdir: outputs
backends:
  hand_pose: mock
  egomotion: mock
  detector: mock
  tracker: mock
  depth: mock
  action_seg: mock
  captioner: mock
  encoder: mock
  policy: mock
  planner: mock
sampling:
  target_fps: 4.0
  min_shot_frames: 8
quality:
  min_resolution: 240
  max_blur: 0.6
  max_occlusion: 0.5
privacy:
  blur_faces: true
  blur_plates: true
  drop_if_unredactable: true
retarget:
  wrist_to_ee_offset:
  - 0.0
  - 0.0
  - -0.03
  gripper_open_dist: 0.08
  gripper_closed_dist: 0.02
  min_confidence: 0.3
safety:
  torque_limit_frac: 0.25
  max_ee_speed: 0.15
  force_limit_n: 10.0
  require_kill_switch: true
  staged_rollout: true
ops:
  dedup_threshold: 0.98
  enable_bias_filter: true
  enable_safety_filter: true
